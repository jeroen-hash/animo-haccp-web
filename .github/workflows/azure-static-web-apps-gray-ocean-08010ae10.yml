name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Publicatiemap voorbereiden
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp admin-dashboard.html site/admin-dashboard.html
          cp onboarding-form.html site/onboarding-form.html
          cp onboarding-dashboard.html site/onboarding-dashboard.html
          cp onboarding-activation-complete.js site/onboarding-activation-complete.js
          cp onboarding-bulk-import-v3.js site/onboarding-bulk-import-v3.js
          cp onboarding-bulk-import-fix.js site/onboarding-bulk-import-fix.js
          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json site/staticwebapp.config.json
          fi

          echo "Bestanden die naar Azure worden gepubliceerd:"
          ls -la site

          test -f site/index.html
          test -f site/admin-dashboard.html

      - name: Publiceren naar Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_OCEAN_08010AE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "site"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_OCEAN_08010AE10 }}
          action: "close"
