name: Deploy ANIMO HACCP test naar STRATO

on:
  push:
    branches:
      - feature/voedselverspilling-module
      - feature/menurendabiliteit-module
      - feature/animo-ai-test-integration
      - feature/phase1-haccp-completion
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/**/*.mjs'
      - '*.mjs'
      - 'images/**'
      - '.github/workflows/deploy-strato-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    name: Publiceer uitsluitend de testomgeving
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Controleren of STRATO-geheimen bestaan
        id: guard
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STRATO SFTP-geheimen ontbreken; testpublicatie overgeslagen."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Testbestanden voorbereiden
        if: steps.guard.outputs.present == 'true'
        run: |
          set -e
          rm -rf out
          mkdir -p out/test/images
          cp index.html sw.js out/test/
          cp ./*.mjs out/test/
          cp -r images/. out/test/images/
          echo "Bestanden voor test.animo-apps.com:"
          find out/test -maxdepth 2 -type f -print

      - name: Testconfiguratie controleren (nooit productie injecteren)
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const file = 'out/test/index.html';
          const built = readFileSync(file, 'utf8');
          const testUrl = 'https://zimzsovvtdmrthrflkgm.supabase.co';
          const testKey = 'sb_publishable_Cgh3XIJouxoWHgwWCT84rA_jkZMU14k';
          const liveUrl = 'https://xwjcwravfeldndwlugai.supabase.co';
          const liveKey = 'sb_publishable_nMuGFmDa34Xm1HQ21kTK9A_uZIRtapI';
          if (!built.includes(testUrl) || !built.includes(testKey)) {
            throw new Error('De testbuild mist de bevestigde Supabase-testconfiguratie.');
          }
          if (built.includes(liveUrl) || built.includes(liveKey)) {
            throw new Error('Live Supabase-configuratie gevonden in testbuild. Publicatie afgebroken.');
          }
          NODE
          echo "Testbuild gebruikt uitsluitend Supabase-testproject zimzsovvtdmrthrflkgm; liveproject xwjcwravfeldndwlugai is uitgesloten."

      - name: Release- en back-upworkflow controleren
        run: |
          set -euo pipefail
          grep -Fq 'cp ./*.mjs out/app/' .github/workflows/deploy-strato.yml
          grep -Fq 'mirror -R --verbose out/app /app' .github/workflows/deploy-strato.yml
          grep -Fq "const liveUrl = 'https://xwjcwravfeldndwlugai.supabase.co'" .github/workflows/deploy-strato.yml
          grep -Fq "built.includes(testUrl) || built.includes(testKey)" .github/workflows/deploy-strato.yml
          grep -Fq 'Controleer releasemigraties zonder de live database te wijzigen' .github/workflows/deploy-strato.yml
          grep -Fq 'Geen verbinding met live DB en geen SQL/migratie wordt uitgevoerd.' .github/workflows/deploy-strato.yml
          if grep -Eq 'supabase[[:space:]]+db[[:space:]]+push' .github/workflows/deploy-strato.yml; then
            echo "::error::Productiedeploy mag geen database-migraties uitvoeren."
            exit 1
          fi
          if grep -Eq 'PRODUCTION_DATABASE_(URL|PASSWORD)' .github/workflows/deploy-strato.yml; then
            echo "::error::Productiedeploy mag geen live databasegeheimen gebruiken."
            exit 1
          fi
          grep -Fq 'actions/checkout@v4' .github/workflows/backup-supabase-database.yml
          for migration in 20261111222221 20261111222452 20261111223111 20261112155500 20261112155729 20261112163255 20261112174321; do
            grep -Fq "$migration" .github/workflows/deploy-strato.yml
          done
          for file in ./*.mjs; do
            node --check "$file"
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const match of scripts) {
            const attrs = match[1] || '';
            const type = (attrs.match(/\btype=["']([^"']+)["']/i) || [])[1] || '';
            if (type && !/^(text\/javascript|application\/javascript|module)$/i.test(type)) continue;
            const source = match[2] || '';
            if (!source.trim()) continue;
            const path = '/tmp/animo-inline-' + checked + '.js';
            writeFileSync(path, source);
            const result = spawnSync(process.execPath, ['--check', path], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout || 'Inline script syntax error');
              process.exit(result.status || 1);
            }
            checked++;
          }
          console.log('Inline scripts syntax checked:', checked);
          NODE
          node --test tests/*.test.mjs

      - name: Uploaden naar uitsluitend /test
        if: steps.guard.outputs.present == 'true'
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y lftp
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 22 -t ed25519 "$SFTP_HOST" > "$RUNNER_TEMP/strato_known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/strato_known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$RUNNER_TEMP/strato_known_hosts" -E sha256 | awk '{print $2}')"
          EXPECTED_FINGERPRINT="SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::STRATO SSH-hostkey fingerprint komt niet overeen. Upload afgebroken."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/strato_known_hosts"
          lftp -e "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/strato_known_hosts'" -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<'LFTP'
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose out/test /test
          bye
          LFTP

# Trigger test-only publication for phase 1 HACCP modules.
