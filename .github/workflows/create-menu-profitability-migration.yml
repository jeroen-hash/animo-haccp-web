name: Create menu profitability manager update policy migration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/voedselverspilling-module
    paths:
      - ".github/workflows/create-menu-profitability-migration.yml"
  push:
    branches:
      - feature/menurendabiliteit-module
    paths:
      - ".github/workflows/create-menu-profitability-migration.yml"

permissions:
  contents: write

jobs:
  create-migration:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/menurendabiliteit-module') || github.ref == 'refs/heads/feature/menurendabiliteit-module'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout menu profitability branch
        uses: actions/checkout@v4
        with:
          ref: feature/menurendabiliteit-module
          fetch-depth: 0

      - name: Install official Supabase CLI
        uses: supabase/setup-cli@v3

      - name: Generate migration scaffold with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new allow_manager_updates_menu_profitability_data
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_create_menu_profitability_private_data.sql' -print -quit)"
          test -n "$migration_file"
          test -f "$migration_file"
          echo "Generated: $migration_file"

      - name: Commit generated manager update policy migration
        shell: bash
        run: |
          set -euo pipefail
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_create_menu_profitability_private_data.sql' -print -quit)"
          test -n "$migration_file"
          git fetch origin feature/menurendabiliteit-module
          git rebase origin/feature/menurendabiliteit-module
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_file"
          if git diff --cached --quiet; then
            echo "No new migration file to commit."
            exit 0
          fi
          git commit -m "chore(db): generate menu profitability manager update migration scaffold"
          git push origin HEAD:feature/menurendabiliteit-module
