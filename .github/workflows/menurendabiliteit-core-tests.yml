name: Menu profitability core tests

on:
  pull_request:
    paths:
      - "menurendabiliteit-core.mjs"
      - "tests/menurendabiliteit-core.test.mjs"
      - "tests/module-stock-integration.test.mjs"
      - "voedselverspilling-stock.mjs"
      - ".github/workflows/menurendabiliteit-core-tests.yml"
  push:
    branches:
      - "feature/menurendabiliteit-module"
    paths:
      - "menurendabiliteit-core.mjs"
      - "tests/menurendabiliteit-core.test.mjs"
      - ".github/workflows/menurendabiliteit-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: node --check menurendabiliteit-core.mjs && node --check menurendabiliteit-ui.mjs
      - name: Run menu profitability tests
        run: node --test tests/menurendabiliteit-core.test.mjs tests/module-stock-integration.test.mjs
