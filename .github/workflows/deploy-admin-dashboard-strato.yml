name: Publiceer alleen Admin-dashboard naar STRATO

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard.html'
      - '.github/workflows/deploy-admin-dashboard-strato.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Controleren of STRATO-inloggegevens bestaan
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "::error::STRATO SFTP-geheimen ontbreken."
            exit 1
          fi

      - name: Upload uitsluitend admin-dashboard.html
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          set -e
          test -f admin-dashboard.html
          sudo apt-get update -y
          sudo apt-get install -y lftp
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 22 -t ed25519 "$SFTP_HOST" > "$RUNNER_TEMP/strato_known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/strato_known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$RUNNER_TEMP/strato_known_hosts" -E sha256 | awk '{print $2}')"
          EXPECTED_FINGERPRINT="SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::STRATO SSH-hostkey fingerprint komt niet overeen. Upload afgebroken."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/strato_known_hosts"
          lftp -e "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/strato_known_hosts'" -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<'LFTP'
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          put admin-dashboard.html -o /app/admin-dashboard.html
          get /app/admin-dashboard.html -o admin-dashboard-live.html
          bye
          LFTP

          echo "Controleer SHA-256 van lokaal en live bestand..."
          LOCAL_SHA="$(sha256sum admin-dashboard.html | awk '{print $1}')"
          LIVE_SHA="$(sha256sum admin-dashboard-live.html | awk '{print $1}')"
          echo "GitHub-bestand: $LOCAL_SHA"
          echo "STRATO-bestand: $LIVE_SHA"
          if [ "$LOCAL_SHA" != "$LIVE_SHA" ]; then
            echo "::error::Het bestand op STRATO komt niet overeen met de GitHub-versie."
            exit 1
          fi
          echo "::notice::STRATO-bestand succesvol teruggelezen en SHA-256 komt overeen."
