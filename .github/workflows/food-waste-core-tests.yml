name: Food waste core tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "voedselverspilling-core.mjs"
      - "tests/voedselverspilling-core.test.mjs"
      - ".github/workflows/food-waste-core-tests.yml"
      - "supabase/migrations/20261111220217_create_food_waste_entries.sql"
      - "tests/voedselverspilling-migration.test.mjs"
  push:
    branches:
      - "feature/voedselverspilling-module"
    paths:
      - "voedselverspilling-core.mjs"
      - "tests/voedselverspilling-core.test.mjs"
      - ".github/workflows/food-waste-core-tests.yml"
      - "supabase/migrations/20261111220217_create_food_waste_entries.sql"
      - "tests/voedselverspilling-migration.test.mjs"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run food waste core tests
        run: node --test tests/voedselverspilling-core.test.mjs tests/voedselverspilling-migration.test.mjs
