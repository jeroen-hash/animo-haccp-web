name: Encrypted Supabase database backup to STRATO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: animo-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Required secrets controleren
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.STRATO_SFTP_HOST_KEY_SHA256 }}
          BACKUP_PASSPHRASE: ${{ secrets.ANIMO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL DATABASE_PASSWORD SFTP_HOST SFTP_USER SFTP_PASS SFTP_HOST_KEY_SHA256 BACKUP_PASSPHRASE; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Required repository secret is missing: $name"
              exit 1
            fi
          done
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::PRODUCTION_DATABASE_URL must be a PostgreSQL connection URI."; exit 1 ;;
          esac
          echo "All required secret names are configured. Secret values are not displayed."

      - name: Tools installeren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg lftp openssh-client
          docker --version

      - name: Database logisch exporteren
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$DATABASE_PASSWORD"

          # Parse only non-secret connection details. The password is supplied separately
          # through PGPASSWORD, so special characters never need URI percent-encoding.
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote, parse_qs
          from pathlib import Path

          parsed = urlsplit(os.environ["DATABASE_URL"])
          if parsed.scheme not in ("postgres", "postgresql") or not parsed.hostname:
              raise SystemExit("PRODUCTION_DATABASE_URL is not a valid PostgreSQL URI.")
          if parsed.password:
              raise SystemExit("Remove the password from PRODUCTION_DATABASE_URL; store it only in PRODUCTION_DATABASE_PASSWORD.")
          username = unquote(parsed.username or "")
          database = unquote(parsed.path.lstrip("/"))
          if not username or not database:
              raise SystemExit("The PostgreSQL URI must include a username and database name.")
          if not parsed.hostname.endswith(".pooler.supabase.com"):
              raise SystemExit("The database host is not a Supabase pooler host.")
          if not username.startswith("postgres."):
              raise SystemExit("Use the full Supabase Session Pooler username, including the project reference.")
          if "sslmode" in parse_qs(parsed.query) and parse_qs(parsed.query)["sslmode"][0] != "require":
              raise SystemExit("The database connection must use sslmode=require.")
          values = {
              "PGHOST": parsed.hostname,
              "PGPORT": str(parsed.port or 5432),
              "PGUSER": username,
              "PGDATABASE": database,
              "PGSSLMODE": "require",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envfile:
              for key, value in values.items():
                  envfile.write(f"{key}={value}\\n")
          PY

          dump="$RUNNER_TEMP/animo-database.dump"
          docker run --rm \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGSSLMODE \
            -e PGPASSWORD="$DATABASE_PASSWORD" \
            -v "$RUNNER_TEMP:/backup" \
            postgres:17-alpine \
            sh -ec 'pg_dump --format=custom --no-owner --no-acl --compress=6 --schema=public --schema=private --schema=auth --schema=storage --file=/backup/animo-database.dump'
          test -s "$dump"
          echo "Database dump created. File size: $(stat -c '%s' "$dump") bytes."
          unset DATABASE_URL DATABASE_PASSWORD

      - name: Back-up versleutelen en checksum maken
        id: archive
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.ANIMO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          dump="$RUNNER_TEMP/animo-database.dump"
          test -s "$dump"
          encrypted="$RUNNER_TEMP/animo-database-$stamp.dump.gpg"
          passfile="$RUNNER_TEMP/database-backup-passphrase"
          printf '%s' "$BACKUP_PASSPHRASE" > "$passfile"
          chmod 600 "$passfile"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --symmetric --cipher-algo AES256 --output "$encrypted" "$dump"
          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "encrypted_file=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$encrypted.sha256" >> "$GITHUB_OUTPUT"
          echo "backup_name=$(basename "$encrypted")" >> "$GITHUB_OUTPUT"
          rm -f "$dump" "$passfile"
          unset BACKUP_PASSPHRASE

      - name: STRATO-hostsleutel controleren en back-up uploaden
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.STRATO_SFTP_HOST_KEY_SHA256 }}
          ENCRYPTED_FILE: ${{ steps.archive.outputs.encrypted_file }}
          CHECKSUM_FILE: ${{ steps.archive.outputs.checksum_file }}
          BACKUP_NAME: ${{ steps.archive.outputs.backup_name }}
          BACKUP_PASSPHRASE: ${{ secrets.ANIMO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          known_hosts="$RUNNER_TEMP/strato_database_known_hosts"
          scanned="$RUNNER_TEMP/strato_database_scanned_keys"
          candidate="$RUNNER_TEMP/strato_database_candidate_key"
          ssh-keyscan -p 22 "$SFTP_HOST" 2>/dev/null > "$scanned"
          test -s "$scanned" || { echo "::error::Could not retrieve STRATO SSH host keys."; exit 1; }
          : > "$known_hosts"
          while IFS= read -r key_line; do
            [ -n "$key_line" ] || continue
            printf '%s\n' "$key_line" > "$candidate"
            fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')"
            if [ "$fingerprint" = "$SFTP_HOST_KEY_SHA256" ]; then
              printf '%s\n' "$key_line" >> "$known_hosts"
            fi
          done < "$scanned"
          test -s "$known_hosts" || { echo "::error::STRATO host key does not match the pinned fingerprint."; exit 1; }
          chmod 600 "$known_hosts"
          rm -f "$scanned" "$candidate"
          lftp_host_key_settings="set sftp:auto-confirm no
          set sftp:connect-program \"ssh -a -x -oStrictHostKeyChecking=yes -oUserKnownHostsFile=$known_hosts\""
          remote_dir="/backups/animo-haccp-database"

          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<LFTP
          $lftp_host_key_settings
          set net:max-retries 3
          set net:timeout 45
          mkdir -p $remote_dir
          put "$ENCRYPTED_FILE" -o "$remote_dir/$BACKUP_NAME"
          put "$CHECKSUM_FILE" -o "$remote_dir/$BACKUP_NAME.sha256"
          bye
          LFTP

          downloaded="$RUNNER_TEMP/roundtrip-$BACKUP_NAME"
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<LFTP
          $lftp_host_key_settings
          set net:max-retries 3
          set net:timeout 45
          get "$remote_dir/$BACKUP_NAME" -o "$downloaded"
          get "$remote_dir/$BACKUP_NAME.sha256" -o "$downloaded.sha256"
          bye
          LFTP

          expected="$(cut -d ' ' -f 1 "$CHECKSUM_FILE")"
          actual="$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
          test "$expected" = "$actual" || { echo "::error::STRATO round-trip checksum mismatch."; exit 1; }

          passfile="$RUNNER_TEMP/database-backup-passphrase"
          restored="$RUNNER_TEMP/verified-database.dump"
          printf '%s' "$BACKUP_PASSPHRASE" > "$passfile"
          chmod 600 "$passfile"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --decrypt --output "$restored" "$downloaded"
          docker run --rm -v "$RUNNER_TEMP:/backup" postgres:17-alpine \
            pg_restore --list "/backup/verified-database.dump" >/dev/null
          rm -f "$passfile" "$restored" "$downloaded" "$downloaded.sha256" "$known_hosts"
          unset SFTP_PASS BACKUP_PASSPHRASE
          echo "Encrypted database backup uploaded, downloaded, checksum-verified, decrypted and archive-verified successfully."

      - name: Foutmelding bij mislukte back-up
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ANIMO HACCP database-back-up mislukt';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `@jeroen-hash, de database-back-up naar STRATO is mislukt. Controleer de uitvoering voordat je ervan uitgaat dat de nieuwste back-up veilig is opgeslagen: ${runUrl}. De foutmelding bevat geen databasewachtwoord.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body
              });
            }
