name: Render ANIMO HACCP promo video

on:
  push:
    paths:
      - "marketing/video-preview.html"
      - "images/animo-logo.png.png"
      - "images/app-dashboard.jpg"
      - "images/app-temperaturen.jpg"
      - "images/app-rapport.jpg"
      - ".github/workflows/render-promo-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture five crisp mobile scenes
        run: |
          mkdir -p scenes
          cat > render.cjs <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 390, height: 693 },
              deviceScaleFactor: 1080 / 390
            });
            await page.goto('file://' + path.resolve('marketing/video-preview.html'), { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              await document.fonts.ready;
              await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
              document.getAnimations().forEach(a => { a.pause(); a.currentTime = 0; });
            });
            const moments = [5, 13, 22, 31, 40];
            for (let i = 0; i < moments.length; i++) {
              await page.evaluate(ms => {
                document.getAnimations().forEach(a => { a.pause(); a.currentTime = ms * 1000; });
              }, moments[i]);
              await page.waitForTimeout(100);
              await page.screenshot({ path: 'scenes/scene-' + (i + 1) + '.png' });
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node render.cjs
          for f in scenes/scene-*.png; do
            convert "$f" -resize 1080x1920! "$f"
            file "$f"
          done
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 scenes/scene-1.png)" = "1080x1920"

      - name: Assemble smooth vertical MP4
        run: |
          ffmpeg -y \
            -loop 1 -t 9 -i scenes/scene-1.png \
            -loop 1 -t 9 -i scenes/scene-2.png \
            -loop 1 -t 9 -i scenes/scene-3.png \
            -loop 1 -t 9 -i scenes/scene-4.png \
            -loop 1 -t 9 -i scenes/scene-5.png \
            -filter_complex "
              [0:v]zoompan=z='min(zoom+0.00035,1.035)':d=180:s=1080x1920:fps=20,setsar=1,format=yuv420p[v0];
              [1:v]zoompan=z='min(zoom+0.00035,1.035)':d=180:s=1080x1920:fps=20,setsar=1,format=yuv420p[v1];
              [2:v]zoompan=z='min(zoom+0.00035,1.035)':d=180:s=1080x1920:fps=20,setsar=1,format=yuv420p[v2];
              [3:v]zoompan=z='min(zoom+0.00035,1.035)':d=180:s=1080x1920:fps=20,setsar=1,format=yuv420p[v3];
              [4:v]zoompan=z='min(zoom+0.00035,1.035)':d=180:s=1080x1920:fps=20,setsar=1,format=yuv420p[v4];
              [v0][v1]xfade=transition=fade:duration=0.6:offset=8.4[x1];
              [x1][v2]xfade=transition=fade:duration=0.6:offset=16.8[x2];
              [x2][v3]xfade=transition=fade:duration=0.6:offset=25.2[x3];
              [x3][v4]xfade=transition=fade:duration=0.6:offset=33.6,format=yuv420p[outv]
            " -map "[outv]" -an -c:v libx264 -preset medium -crf 18 -movflags +faststart animo-haccp-promotievideo.mp4
          test -s animo-haccp-promotievideo.mp4

      - name: Publish downloadable MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: animo-haccp-promotievideo
          name: ANIMO HACCP promotievideo
          body: "Verticale MP4 met vijf afzonderlijk gerenderde, scherpe mobiele scènes en vloeiende overgangen. Nog zonder voice-over of muziek."
          files: animo-haccp-promotievideo.mp4
          overwrite_files: true
          make_latest: true
