name: Encrypted Supabase Storage backup to STRATO

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: animo-storage-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript-syntax controleren
        run: |
          node --check scripts/backup-supabase-storage.mjs
          node --check scripts/verify-storage-backup.mjs

      - name: Benodigde tools installeren
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg lftp

      - name: Privébestanden uit Supabase verzamelen
        env:
          SUPABASE_URL: https://zimzsovvtdmrthrflkgm.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_OUTPUT_DIR: storage-backup
        run: node scripts/backup-supabase-storage.mjs

      - name: Back-up archiveren en versleutelen
        id: archive
        env:
          BACKUP_PASSPHRASE: ${{ secrets.ANIMO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Backup encryption secret is missing."; exit 1; }
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          archive="$RUNNER_TEMP/animo-storage-$stamp.tar.gz"
          encrypted="$RUNNER_TEMP/animo-storage-$stamp.tar.gz.gpg"
          passfile="$RUNNER_TEMP/backup-passphrase"
          printf '%s' "$BACKUP_PASSPHRASE" > "$passfile"
          chmod 600 "$passfile"
          tar -czf "$archive" -C storage-backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --symmetric --cipher-algo AES256 --output "$encrypted" "$archive"
          sha256sum "$encrypted" > "$encrypted.sha256"
          echo "encrypted_file=$encrypted" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$encrypted.sha256" >> "$GITHUB_OUTPUT"
          echo "backup_name=$(basename "$encrypted")" >> "$GITHUB_OUTPUT"
          rm -f "$archive" "$passfile"
          unset BACKUP_PASSPHRASE

      - name: Versleutelde back-up uploaden naar STRATO en terug controleren
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.STRATO_SFTP_HOST_KEY_SHA256 }}
          ENCRYPTED_FILE: ${{ steps.archive.outputs.encrypted_file }}
          CHECKSUM_FILE: ${{ steps.archive.outputs.checksum_file }}
          BACKUP_NAME: ${{ steps.archive.outputs.backup_name }}
          BACKUP_PASSPHRASE: ${{ secrets.ANIMO_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          for value in "$SFTP_HOST" "$SFTP_USER" "$SFTP_PASS" "$BACKUP_PASSPHRASE"; do
            test -n "$value" || { echo "::error::A required backup secret is missing."; exit 1; }
          done

          # Pin the SSH host key when the independently verified fingerprint secret is configured.
          # Keep the existing backup operational until the owner has added that secret.
          known_hosts="$RUNNER_TEMP/strato_known_hosts"
          lftp_host_key_settings='set sftp:auto-confirm yes'
          if [ -n "${SFTP_HOST_KEY_SHA256:-}" ]; then
            ssh-keyscan -p 22 "$SFTP_HOST" 2>/dev/null > "$known_hosts"
            test -s "$known_hosts" || { echo "::error::Could not retrieve the STRATO SSH host key."; exit 1; }
            if ! ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}' | grep -Fxq "$SFTP_HOST_KEY_SHA256"; then
              echo "::error::STRATO SSH host key fingerprint does not match the pinned value."; exit 1
            fi
            chmod 600 "$known_hosts"
            lftp_host_key_settings="set sftp:auto-confirm no
          set sftp:connect-program \"ssh -a -x -oStrictHostKeyChecking=yes -oUserKnownHostsFile=$known_hosts\""
            echo "Verified STRATO SSH host key fingerprint; strict host-key checking enabled."
          else
            echo "::warning::STRATO SSH host-key pinning is not configured yet. Add repository secret STRATO_SFTP_HOST_KEY_SHA256 after verifying the fingerprint with STRATO."
          fi
          remote_dir="/backups/animo-haccp-storage"
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<LFTP
          $lftp_host_key_settings
          set net:max-retries 3
          set net:timeout 30
          mkdir -p $remote_dir
          put "$ENCRYPTED_FILE" -o "$remote_dir/$BACKUP_NAME"
          put "$CHECKSUM_FILE" -o "$remote_dir/$BACKUP_NAME.sha256"
          bye
          LFTP

          downloaded="$RUNNER_TEMP/roundtrip-$BACKUP_NAME"
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<LFTP
          $lftp_host_key_settings
          set net:max-retries 3
          set net:timeout 30
          get "$remote_dir/$BACKUP_NAME" -o "$downloaded"
          bye
          LFTP
          expected="$(cut -d ' ' -f 1 "$CHECKSUM_FILE")"
          actual="$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
          test "$expected" = "$actual" || { echo "::error::STRATO round-trip checksum mismatch."; exit 1; }

          passfile="$RUNNER_TEMP/backup-passphrase"
          restored="$RUNNER_TEMP/restored-backup.tar.gz"
          restore_dir="$RUNNER_TEMP/storage-backup-restore-check"
          printf '%s' "$BACKUP_PASSPHRASE" > "$passfile"
          chmod 600 "$passfile"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" \
            --decrypt --output "$restored" "$downloaded"
          tar -tzf "$restored" >/dev/null
          mkdir -m 700 "$restore_dir"
          tar -xzf "$restored" -C "$restore_dir"
          BACKUP_EXTRACT_DIR="$restore_dir" node scripts/verify-storage-backup.mjs
          rm -rf "$restore_dir"
          rm -f "$passfile" "$restored" "$downloaded"
          unset BACKUP_PASSPHRASE SFTP_PASS
          echo "Encrypted STRATO backup uploaded, downloaded, checksum-verified, decrypted and content-verified successfully."

      - name: Melding bij mislukte back-up
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ANIMO HACCP storage-back-up mislukt';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const message = `@jeroen-hash, de automatische ANIMO HACCP Storage-back-up is mislukt. Bekijk de uitvoeringsdetails: ${runUrl}. Controleer de fout voordat je ervan uitgaat dat de nieuwste back-up veilig is opgeslagen.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: message
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: message
              });
            }
