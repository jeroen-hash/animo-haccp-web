name: Validate onboarding Stripe fees

on:
  pull_request:
    branches: [main]
    paths:
      - "onboarding-form.html"
      - "onboarding-dashboard.html"
      - "onboarding-activation.js"
      - "supabase/functions/submit-onboarding-lead/**"
      - "supabase/functions/activate-onboarding-lead/**"
      - "supabase/functions/create-onboarding-payment/**"
      - "supabase/functions/stripe-webhook/**"
      - "tests/onboarding-stripe-fees.test.mjs"
      - ".github/workflows/validate-onboarding-stripe.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check onboarding fee and payment safeguards
        run: node --test tests/onboarding-stripe-fees.test.mjs
      - name: Type-check affected Supabase Edge Functions
        run: |
          deno check --no-lock \
            supabase/functions/submit-onboarding-lead/index.ts \
            supabase/functions/activate-onboarding-lead/index.ts \
            supabase/functions/create-onboarding-payment/index.ts \
            supabase/functions/stripe-webhook/index.ts
