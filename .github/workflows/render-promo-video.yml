name: Render ANIMO HACCP promo video

on:
  push:
    paths:
      - "marketing/video-preview.html"
      - "images/animo-logo.png.png"
      - "images/app-dashboard.jpg"
      - "images/app-temperaturen.jpg"
      - "images/app-rapport.jpg"
      - ".github/workflows/render-promo-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render mobile-layout frames at full HD
        run: |
          mkdir -p frames
          cat > render.cjs <<'EOF'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            // Render at the CSS dimensions the mobile design was authored for,
            // then use device scale factor to produce a 1080x1920 master.
            const page = await browser.newPage({
              viewport: { width: 390, height: 693 },
              deviceScaleFactor: 1080 / 390
            });
            await page.goto('file://' + path.resolve('marketing/video-preview.html'), { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              await document.fonts.ready;
              await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
              document.getAnimations().forEach(animation => {
                animation.pause();
                animation.currentTime = 0;
              });
            });
            const fps = 20;
            const duration = 45;
            for (let frame = 0; frame < fps * duration; frame++) {
              const time = frame * 1000 / fps;
              await page.evaluate(ms => {
                document.getAnimations().forEach(animation => {
                  animation.currentTime = ms;
                });
              }, time);
              await page.screenshot({
                path: 'frames/frame-' + String(frame).padStart(5, '0') + '.png',
                animations: 'allow'
              });
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node render.cjs
          identify frames/frame-00000.png
          ffmpeg -y -framerate 20 -i frames/frame-%05d.png -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -movflags +faststart animo-haccp-promotievideo.mp4
          test -s animo-haccp-promotievideo.mp4

      - name: Publish downloadable MP4
        uses: softprops/action-gh-release@v2
        with:
          tag_name: animo-haccp-promotievideo
          name: ANIMO HACCP promotievideo
          body: "Verticale MP4-promotievideo van ANIMO HACCP. Render met correcte mobiele CSS-schaal op 1080x1920. Nog zonder voice-over of muziek."
          files: animo-haccp-promotievideo.mp4
          overwrite_files: true
          make_latest: true
