name: Deploy ANIMO HACCP test naar STRATO

on:
  push:
    branches:
      - feature/voedselverspilling-module
      - feature/menurendabiliteit-module
      - feature/animo-ai-test-integration
      - feature/phase1-haccp-completion
      - test/favv-inspectiedossier
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/**/*.mjs'
      - '*.mjs'
      - 'images/**'
      - '.github/workflows/deploy-strato-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    name: Publiceer uitsluitend de testomgeving
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Controleren of STRATO-geheimen bestaan
        id: guard
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STRATO SFTP-geheimen ontbreken; testpublicatie overgeslagen."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Testbestanden voorbereiden
        if: steps.guard.outputs.present == 'true'
        run: |
          set -e
          rm -rf out
          mkdir -p out/test/images
          cp index.html sw.js out/test/
          cp ./*.mjs out/test/
          cp -r images/. out/test/images/
          echo "Bestanden voor test.animo-apps.com:"
          find out/test -maxdepth 2 -type f -print

      - name: Gerichte HACCP- en cache-regressietests uitvoeren
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          node --test tests/haccp-report-printing.test.mjs tests/haccp-modules.test.mjs tests/service-worker-cache.test.mjs

      - name: Testconfiguratie controleren (nooit productie injecteren)
        if: steps.guard.outputs.present == 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const file = 'out/test/index.html';
          const built = readFileSync(file, 'utf8');
          const testUrl = 'https://xwjcwravfeldndwlugai.supabase.co';
          const testKey = 'sb_publishable_nMuGFmDa34Xm1HQ21kTK9A_uZIRtapI';
          const liveUrl = 'https://zimzsovvtdmrthrflkgm.supabase.co';
          const liveKey = 'sb_publishable_Cgh3XIJouxoWHgwWCT84rA_jkZMU14k';
          if (!built.includes(testUrl) || !built.includes(testKey)) {
            throw new Error('De testbuild mist de bevestigde Supabase-testconfiguratie.');
          }
          if (built.includes(liveUrl) || built.includes(liveKey)) {
            throw new Error('Live Supabase-configuratie gevonden in testbuild. Publicatie afgebroken.');
          }
          NODE
          echo "Testbuild gebruikt uitsluitend Supabase-project ANIMO HACCP xwjcwravfeldndwlugai; liveproject animo-haccp-test zimzsovvtdmrthrflkgm is uitgesloten."

      - name: Release- en back-upworkflow controleren
        run: |
          set -euo pipefail
          grep -Fq 'cp ./*.mjs out/app/' .github/workflows/deploy-strato.yml
          grep -Fq 'mirror -R --verbose out/app /app' .github/workflows/deploy-strato.yml
          grep -Fq "const liveUrl = 'https://zimzsovvtdmrthrflkgm.supabase.co'" .github/workflows/deploy-strato.yml
          grep -Fq "built.includes('https://xwjcwravfeldndwlugai.supabase.co')" .github/workflows/deploy-strato.yml
          grep -Fq 'Controleer releasemigraties zonder de live database te wijzigen' .github/workflows/deploy-strato.yml
          grep -Fq 'Geen verbinding met live DB en geen SQL/migratie wordt uitgevoerd.' .github/workflows/deploy-strato.yml
          if grep -Eq 'supabase[[:space:]]+db[[:space:]]+push' .github/workflows/deploy-strato.yml; then
            echo "::error::Productiedeploy mag geen database-migraties uitvoeren."
            exit 1
          fi
          if grep -Eq 'PRODUCTION_DATABASE_(URL|PASSWORD)' .github/workflows/deploy-strato.yml; then
            echo "::error::Productiedeploy mag geen live databasegeheimen gebruiken."
            exit 1
          fi
          grep -Fq 'actions/checkout@v4' .github/workflows/backup-supabase-database.yml
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const workflow = readFileSync('.github/workflows/deploy-strato.yml', 'utf8');
          const upload = workflow.indexOf('      - name: Uploaden via SFTP');
          const finalValidation = workflow.lastIndexOf('      - name: Validate UBL unit dropdown mobile change handling');
          if (upload < 0 || finalValidation < 0 || upload < finalValidation) {
            throw new Error('Production SFTP upload must occur only after all validation steps.');
          }
          if (workflow.slice(upload).split('\n').slice(1).some(line => line.startsWith('      - name: '))) {
            throw new Error('No workflow step may run after the production SFTP upload.');
          }
          NODE
          for migration in 20261111222221 20261111222452 20261111223111 20261112155500 20261112155729 20261112163255 20261112174321; do
            grep -Fq "$migration" .github/workflows/deploy-strato.yml
          done
          for file in ./*.mjs; do
            node --check "$file"
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const match of scripts) {
            const attrs = match[1] || '';
            if (/\bsrc\s*=/i.test(attrs)) continue;
            const type = (attrs.match(/\btype=["']([^"']+)["']/i) || [])[1] || '';
            if (type && !/^(text\/javascript|application\/javascript|module)$/i.test(type)) continue;
            const source = match[2] || '';
            if (/<script\b/i.test(source)) continue;
            if (!source.trim()) continue;
            const path = '/tmp/animo-inline-' + checked + '.js';
            writeFileSync(path, source);
            const result = spawnSync(process.execPath, ['--check', path], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout || 'Inline script syntax error');
              process.exit(result.status || 1);
            }
            checked++;
          }
          console.log('Inline scripts syntax checked:', checked);
          NODE

      - name: Uploaden naar uitsluitend /test via beveiligde SFTP
        if: steps.guard.outputs.present == 'true'
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund ssh2@1.16.0
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { createHash } from 'node:crypto';
          import { readdir, stat } from 'node:fs/promises';
          import path from 'node:path';
          const require = createRequire(import.meta.url);
          const { Client } = require('ssh2');
          const expected = 'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q';
          const client = new Client();
          const localRoot = path.resolve('out/test');
          const remoteRoot = '/test';
          const call = (obj, method, ...args) => new Promise((resolve, reject) =>
            obj[method](...args, (error, value) => error ? reject(error) : resolve(value)));
          const exists = async (sftp, remote) => {
            try { await call(sftp, 'stat', remote); return true; } catch { return false; }
          };
          const ensureDir = async (sftp, remote) => {
            if (await exists(sftp, remote)) return;
            try { await call(sftp, 'mkdir', remote); }
            catch (error) { if (error.code !== 4) throw error; }
          };
          const uploadDir = async (sftp, local, remote) => {
            await ensureDir(sftp, remote);
            for (const entry of await readdir(local, { withFileTypes: true })) {
              const src = path.join(local, entry.name);
              const dst = remote.replace(/\\/$/, '') + '/' + entry.name;
              if (entry.isDirectory()) await uploadDir(sftp, src, dst);
              else if (entry.isFile()) await call(sftp, 'fastPut', src, dst);
            }
          };
          await new Promise((resolve, reject) => {
            client.on('ready', resolve).on('error', reject).connect({
              host: process.env.SFTP_HOST, port: 22, username: process.env.SFTP_USER,
              password: process.env.SFTP_PASS, readyTimeout: 30000,
              hostVerifier: key => 'SHA256:' + createHash('sha256').update(key).digest('base64').replace(/=+$/, '') === expected
            });
          });
          try {
            const sftp = await call(client, 'sftp');
            await uploadDir(sftp, localRoot, remoteRoot);
            console.log('SFTP-upload naar uitsluitend /test voltooid.');
          } finally { client.end(); }
          NODE

# Trigger test-only publication for phase 1 HACCP modules.
