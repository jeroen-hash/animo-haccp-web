name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: false # Legacy Azure deployment disabled; protect existing live app
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Publicatiemap voorbereiden
        run: |
          rm -rf site
          mkdir -p site/images

          # Alle afbeeldingen uit de map images (logo, icoon, app-schermen)
          cp -r images/. site/images/

          cp index.html site/index.html
          cp landing.html site/landing.html
          cp admin-dashboard.html site/admin-dashboard.html
          cp onboarding-form.html site/onboarding-form.html
          cp onboarding-dashboard.html site/onboarding-dashboard.html
          cp onboarding-activation.js site/onboarding-activation.js
          cp onboarding-bulk-import.js site/onboarding-bulk-import.js
          cp onboarding-bulk-import-fix.js site/onboarding-bulk-import-fix.js
          cp onboarding-temperature-templates.js site/onboarding-temperature-templates.js
          cp onboarding-invite-users.js site/onboarding-invite-users.js

          # Optionele pagina's: alleen meenemen als ze bestaan
          for f in privacy.html algemene-voorwaarden.html verwerkersovereenkomst.html wachtwoord-vergeten.html; do
            if [ -f "$f" ]; then
              cp "$f" "site/$f"
            fi
          done

          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json site/staticwebapp.config.json
          fi

          echo "Bestanden die naar Azure worden gepubliceerd:"
          ls -la site site/images

          test -f site/index.html
          test -f site/landing.html
          test -f site/admin-dashboard.html
          test -f site/onboarding-form.html
          test -f site/onboarding-dashboard.html
          test -f site/onboarding-activation.js
          test -f site/onboarding-bulk-import.js
          test -f site/onboarding-bulk-import-fix.js

      - name: Publiceren naar Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_OCEAN_08010AE10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "site"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: false # Legacy Azure preview deployments disabled
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_OCEAN_08010AE10 }}
          action: "close"
