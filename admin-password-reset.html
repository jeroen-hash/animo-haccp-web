<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ANIMO Apps | Nieuw wachtwoord</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#04100d;color:#e9f5ef;font:15px system-ui;padding:20px}.panel{width:min(420px,100%);box-sizing:border-box;background:#081a16;border:1px solid #173a2e;border-radius:18px;padding:28px}h1{font-size:25px}p{color:#9bbcaf;line-height:1.6}label{display:block;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #28513e;background:#04100d;color:#fff}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#12c98b;color:#03160f;font-weight:800}#message{margin-top:15px;line-height:1.6}</style></head>
<body><main class="panel"><h1>Nieuw wachtwoord instellen</h1><p>Stel een nieuw wachtwoord in voor je ANIMO Apps-beheerdersaccount.</p><form id="resetForm" class="hidden"><label for="password">Nieuw wachtwoord</label><input id="password" type="password" minlength="10" autocomplete="new-password" required><label for="confirm">Herhaal wachtwoord</label><input id="confirm" type="password" minlength="10" autocomplete="new-password" required><button type="submit">Wachtwoord opslaan</button></form><div id="message" role="status">Herstellink controleren…</div></main>
<script>
const CONFIG={url:'https://zimzsovvtdmrthrflkgm.supabase.co',key:'sb_publishable_Cgh3XIJouxoWHgwWCT84rA_jk'};
const sb=supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('resetForm'),msg=document.getElementById('message');
(async()=>{const {data,error}=await sb.auth.getSession();if(error||!data.session){msg.textContent='Deze herstel-link is ongeldig of verlopen. Vraag via het beheerdashboard een nieuwe herstelmail aan.';return;}if((data.session.user.email||'').toLowerCase()!=='admin@animo-apps.com'){await sb.auth.signOut();msg.textContent='Deze herstel-link hoort niet bij het toegelaten ANIMO Apps-beheeraccount.';return;}form.classList.remove('hidden');msg.textContent='Kies een nieuw wachtwoord van minstens 10 tekens.';})();
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p.length<10){msg.textContent='Gebruik minstens 10 tekens.';return;}if(p!==c){msg.textContent='De wachtwoorden komen niet overeen.';return;}const button=form.querySelector('button');button.disabled=true;const {error}=await sb.auth.updateUser({password:p});button.disabled=false;if(error){msg.textContent='Wachtwoord opslaan mislukt: '+error.message;return;}await sb.auth.signOut();form.classList.add('hidden');msg.textContent='Je wachtwoord is bijgewerkt. Ga nu naar het platformbeheer en meld je aan met admin@animo-apps.com.';setTimeout(()=>location.replace('/admin-dashboard.html'),1800);});
</script></body></html>
