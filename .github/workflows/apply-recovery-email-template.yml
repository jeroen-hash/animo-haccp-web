name: Apply ANIMO HACCP recovery email template

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-recovery-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate recovery template
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/email-templates/reset-password.html
          grep -Fq '{{ .TokenHash }}' supabase/email-templates/reset-password.html
          grep -Fq '{{ .RedirectTo }}' supabase/email-templates/reset-password.html
          grep -Fq 'Nieuw wachtwoord instellen' supabase/email-templates/reset-password.html
          echo "Recovery template contains the expected branded button and TokenHash flow."

      - name: Update active Supabase Auth recovery template
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          PROJECT_REF="zimzsovvtdmrthrflkgm"
          SUBJECT="Wachtwoord opnieuw instellen – ANIMO HACCP"
          TEMPLATE="$(cat supabase/email-templates/reset-password.html)"

          jq -n --arg subject "$SUBJECT" --arg content "$TEMPLATE" \
            '{mailer_subjects_recovery:$subject,mailer_templates_recovery_content:$content}' \
            > /tmp/recovery-template-payload.json

          PATCH_STATUS="$(curl --silent --show-error --output /tmp/recovery-patch-response.json \
            --write-out '%{http_code}' \
            --request PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/recovery-template-payload.json)"

          if [ "$PATCH_STATUS" != "200" ]; then
            echo "::error::Supabase rejected the recovery template update (HTTP $PATCH_STATUS)."
            cat /tmp/recovery-patch-response.json
            exit 1
          fi

          GET_STATUS="$(curl --silent --show-error --output /tmp/recovery-auth-config.json \
            --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"

          if [ "$GET_STATUS" != "200" ]; then
            echo "::error::Could not verify the active Supabase Auth template (HTTP $GET_STATUS)."
            exit 1
          fi

          jq -e --arg subject "$SUBJECT" --arg content "$TEMPLATE" \
            '.mailer_subjects_recovery == $subject and .mailer_templates_recovery_content == $content' \
            /tmp/recovery-auth-config.json > /dev/null

          echo "Verified: the active live Supabase Recovery template matches the branded ANIMO HACCP TokenHash template."
