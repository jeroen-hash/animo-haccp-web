name: Food waste PostgreSQL security tests

on:
  pull_request:
    paths:
      - "supabase/migrations/20261111220217_create_food_waste_entries.sql"
      - "supabase/migrations/20261111222400_tighten_food_waste_table_grants.sql"
      - "tests/food-waste-migration.setup.sql"
      - "tests/food-waste-migration.assertions.sql"
      - ".github/workflows/food-waste-postgres-tests.yml"
  push:
    branches:
      - "feature/voedselverspilling-module"
    paths:
      - "supabase/migrations/20261111220217_create_food_waste_entries.sql"
      - "tests/food-waste-migration.setup.sql"
      - "tests/food-waste-migration.assertions.sql"
      - ".github/workflows/food-waste-postgres-tests.yml"

permissions:
  contents: read

jobs:
  postgres-security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: animo_food_waste_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d animo_food_waste_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply migration and run isolated RLS/Storage assertions
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "postgres:17" { print $1; exit }')"
          if [ -z "$CONTAINER_ID" ]; then
            echo "PostgreSQL service container not found."
            exit 1
          fi
          cat \
            tests/food-waste-migration.setup.sql \
            supabase/migrations/20261111220217_create_food_waste_entries.sql \
            supabase/migrations/20261111222400_tighten_food_waste_table_grants.sql \
            tests/food-waste-migration.assertions.sql \
            | docker exec -i "$CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U postgres -d animo_food_waste_ci
