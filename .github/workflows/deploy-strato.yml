name: Deploy naar Strato (animo-apps.com)

# Dit bestand staat los van de Azure-workflow. Zolang de geheimen
# STRATO_SFTP_HOST, STRATO_SFTP_USER en STRATO_SFTP_PASSWORD niet bestaan,
# slaat deze workflow het uploaden over (groen, zonder iets te doen).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Bouwen en uploaden naar Strato

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Controleren of de SFTP-geheimen bestaan
        id: guard
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASS" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SFTP-geheimen ontbreken. Uploaden naar Strato wordt overgeslagen."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mappen voor landing en app klaarzetten
        if: steps.guard.outputs.present == 'true'
        run: |
          set -e
          rm -rf out
          mkdir -p out/landing out/app

          test -f index.html
          test -f sw.js
          test -f landing.html
          test -f onboarding-form.html

          # Afbeeldingen (logo, icoon, app-schermen)
          cp -r images out/landing/images
          cp -r images out/app/images

          # Landing page: landing.html wordt index.html met adressen voor het nieuwe domein
          python3 - <<'PY'
          s = open('landing.html', encoding='utf-8').read()
          app = 'https://app.animo-apps.com'
          s = s.replace('href="/?signup=1"', 'href="' + app + '/?signup=1"')
          s = s.replace('href="/"', 'href="' + app + '/"')
          # Onboardingformulier wordt op het publieke websitedomein gepubliceerd.
          s = s.replace('https://app.freelance-animo.com/landing.html', 'https://start.animo-apps.com/')
          s = s.replace('https://app.freelance-animo.com/images/', 'https://www.animo-apps.com/images/')
          s = s.replace('href="https://www.animo-apps.com/landing.html"', 'href="https://start.animo-apps.com/"')
          s = s.replace('content="https://www.animo-apps.com/landing.html"', 'content="https://start.animo-apps.com/"')
          assert 'freelance-animo' not in s, 'Oud adres staat nog in landing.html'
          open('out/landing/index.html', 'w', encoding='utf-8').write(s)
          PY

          # Juridische pagina's (alleen als ze bestaan)
          for f in privacy.html algemene-voorwaarden.html verwerkersovereenkomst.html; do
            if [ -f "$f" ]; then cp "$f" "out/landing/$f"; fi
          done

          # Publiceer het onboardingformulier ook op het publieke websitedomein.
          cp onboarding-form.html out/landing/onboarding-form.html
          python3 - <<'PY'
          p = 'out/landing/onboarding-form.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('href="/"', 'href="https://www.animo-apps.com/"')
          s = s.replace('href="/?signup=1"', 'href="https://app.animo-apps.com/?signup=1"')
          s = s.replace('https://animo-apps.com/', 'https://www.animo-apps.com/')
          open(p, 'w', encoding='utf-8').write(s)
          PY

          # App
          cp index.html out/app/index.html
          cp sw.js out/app/sw.js
          for f in admin-dashboard.html onboarding-form.html onboarding-dashboard.html wachtwoord-vergeten.html; do
            if [ -f "$f" ]; then cp "$f" "out/app/$f"; fi
          done
          for f in onboarding-*.js; do
            if [ -f "$f" ]; then cp "$f" "out/app/$f"; fi
          done
          # App-modules (food waste, menu profitability and shared helpers).
          cp ./*.mjs out/app/

          echo "== Te uploaden: landing =="
          ls -la out/landing
          echo "== Te uploaden: app =="
          ls -la out/app

      - name: Controle op oude adressen (alleen informatie)
        if: steps.guard.outputs.present == 'true'
        run: |
          echo "Verwijzingen naar het oude domein in de te uploaden bestanden:"
          grep -rIn "freelance-animo" out || echo "Geen gevonden."

      - name: Uploaden via SFTP
        if: steps.guard.outputs.present == 'true'
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y lftp
          # Controleer de STRATO SSH-hostkey tegen de fingerprint die
          # tijdens de eerste SFTP-verbinding in FileZilla is waargenomen.
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 22 -t ed25519 "$SFTP_HOST" > "$RUNNER_TEMP/strato_known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/strato_known_hosts"
          ACTUAL_FINGERPRINT="$(ssh-keygen -lf "$RUNNER_TEMP/strato_known_hosts" -E sha256 | awk '{print $2}')"
          EXPECTED_FINGERPRINT="SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::STRATO SSH-hostkey fingerprint komt niet overeen. Upload afgebroken."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/strato_known_hosts"
          # Alleen uploaden, nooit verwijderen op de server. SSH weigert
          # elke hostkey die niet overeenkomt met de gecontroleerde key.
          lftp -e "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/strato_known_hosts'" -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" <<'LFTP'
          set net:max-retries 3
          set net:timeout 30
          mirror -R --verbose out/landing /landing
          # Publiceer de app afzonderlijk op de documentroot van app.animo-apps.com.
          # Geen --delete: bestaande bestanden worden niet automatisch verwijderd.
          mirror -R --verbose out/app /app
          bye
          LFTP

      - name: Validate atomic recipe stock consumption
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const extract = (start, end) => {
            const a = html.indexOf(start), b = html.indexOf(end, a);
            if (a < 0 || b < 0) throw new Error('Missing recipe helper: ' + start);
            return html.slice(a, b);
          };
          const planCode = extract('function recipeConsumptionPlan(', 'function recipeShortages(');
          const consumeCode = extract('function consumeRecipePlan(', 'function recipeAvailable(');
          const products = [{id:'eggs',quantity:3,batches:[{quantity:3}]},{id:'milk',quantity:5,batches:[{quantity:5}]}];
          const context = {
            products,
            stockById: id => products.find(p => p.id === id),
            normalizedIngredientAmount: i => Number(i.quantity),
            clone: value => JSON.parse(JSON.stringify(value)),
            state: {stockMovements:[{delta:1}]},
            consumeBatches: (product, amount) => {
              if (product.id === 'milk') return false;
              product.batches[0].quantity -= amount;
              product.quantity -= amount;
              context.state.stockMovements.push({delta:-amount});
              return true;
            }
          };
          vm.runInNewContext(planCode + consumeCode + `
            const recipe = {yield:1,ingredients:[{stockId:'eggs',quantity:2},{stockId:'eggs',quantity:2}]};
            const plan = recipeConsumptionPlan(recipe,1);
            if (plan.length !== 1 || plan[0].need !== 4 || plan[0].shortage !== 1) {
              throw new Error('Duplicate recipe ingredients must be aggregated before stock validation.');
            }
            const validPlan = [{product:products[0],need:1},{product:products[1],need:1}];
            if (consumeRecipePlan(validPlan,'Test',1)) throw new Error('A failed ingredient consumption must reject the whole production.');
            if (products[0].quantity !== 3 || products[0].batches[0].quantity !== 3) {
              throw new Error('Earlier ingredient deductions must be rolled back after a later failure.');
            }
            if (state.stockMovements.length !== 1) throw new Error('Failed production must not leave stock movements.');
          `, context);
          console.log('Atomic recipe stock consumption tests passed.');
          NODE

      - name: Validate UBL unit and currency safety
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const extract = (start, end) => {
            const a = html.indexOf(start), b = html.indexOf(end, a);
            if (a < 0 || b < 0) throw new Error('Missing UBL helper: ' + start);
            return html.slice(a, b);
          };
          const context = {
            findStockMatch: () => ({id:'eggs',unit:'stuks'}),
            convertRecipeQuantity: (q, from, to) => from === to ? q : null
          };
          vm.runInNewContext(extract('function ublUnit(', 'function parseUblInvoice(') +
            extract('function prepareDeliveryRows(', 'function confirmDelivery()') + `
            if (ublUnit('') !== '') throw new Error('Missing UBL unit must stay empty, not default to stuks.');
            if (ublUnit('C62') !== 'stuks' || ublUnit('KGM') !== 'kg') throw new Error('Known UBL unit mappings must remain supported.');
            if (ublUnit('XBX') !== 'doos' || ublUnit('XPK') !== 'verpakking' || ublUnit('XBG') !== 'zak') throw new Error('UN/ECE packaging codes must map to box, package and bag, not dozen/packs/sacks.');
            let blocked = false;
            try { prepareDeliveryRows([{name:'Eieren',quantity:10,unit:''}]); } catch (e) { blocked = /Kies eerst een bevestigde eenheid/.test(e.message); }
            if (!blocked) throw new Error('A missing unit must block stock import.');
            const valid = prepareDeliveryRows([{name:'Eieren',quantity:10,unit:'stuks'}]);
            if (valid.length !== 1 || valid[0].stockQuantity !== 10) throw new Error('A manually confirmed unit should import normally.');
          `, context);
          const currencyGuard = html.includes("currency:ublText(ublChild(invoice,'DocumentCurrencyCode')),") &&
            html.includes("deliveryInvoiceMeta.currency!=='EUR'");
          if (!currencyGuard) throw new Error('UBL import must require explicit EUR currency.');
          console.log('UBL unit and currency safety tests passed.');
          NODE

      - name: Validate UBL unit dropdown choices
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('function deliveryUnitOptions(');
          const end = html.indexOf('function renderDeliveryReview()', start);
          if (start < 0 || end < 0) throw new Error('UBL unit dropdown helper is missing.');
          const context = { html, esc: value => String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') };
          vm.runInNewContext(html.slice(start,end) + `
            const options = deliveryUnitOptions('', 'stuks');
            if (!options.includes('value="stuks"') || !options.includes('value="kg"') || !options.includes('value="liter"')) {
              throw new Error('Predefined stock units must be available.');
            }
            if (!html.includes('<option value="">Kies eenheid</option>')) {
              throw new Error('UBL review must show an empty placeholder requiring an explicit selection.');
            }
            const custom = deliveryUnitOptions('bussel','');
            if (!custom.includes('value="bussel"') || !custom.includes('bussel (factuurcode)')) {
              throw new Error('Unknown invoice unit must remain visible for manual review.');
            }
          `, context);
          const reviewUsesSelect = html.includes('<select data-review="unit" data-index="${i}" required>');
          if (!reviewUsesSelect) throw new Error('UBL review must use a unit dropdown.');
          console.log('UBL unit dropdown tests passed.');
          NODE


      - name: Validate UBL unit dropdown mobile change handling
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const handler = /document\.addEventListener\('change',e=>\{const field=e\.target\.closest\('\[data-review="unit"\]'\);if\(field\)\{const i=Number\(field\.dataset\.index\);if\(deliveryReviewRows\[i\]\)deliveryReviewRows\[i\]\.unit=field\.value\}\}\);/;
          if (!handler.test(html)) throw new Error('Mobile UBL unit change handler is missing or no longer updates the selected row.');
          if (!html.includes('function convertRecipeQuantity(')) throw new Error('Shared unit conversion helper is missing.');
          console.log('UBL mobile change-handler test passed.');
          NODE
